# Config B: Agent <-> Proxy <-> ServerA/ServerB, entirely over Streamable HTTP.
# Reference config for manual runs. Tests allocate ephemeral ports dynamically
# rather than loading this file directly (see docs/decisions/0006).
agent_transport: streamable-http
# Plain HTTP: keep on loopback or behind TLS (docs/decisions/0014).
agent_host: 127.0.0.1
agent_port: 9000
identity:
  # Only SHA-256 digests of tokens are stored. This one is the digest of the
  # development token "dev-token-change-me"; replace it with a random
  # 256-bit token for any real use (see the README and docs/decisions/0014).
  bearer_tokens:
    - principal: local-agent
      token_sha256: f01d2474fd375b4c5eb46064b550034167661b86322f1e1d3cb7645512a06607
policy_path: config/policies/default.yaml
audit_log_path: proxy_audit.jsonl
# Operator classification of tool semantics, and enabled defenses (V3).
tools_path: config/tools.yaml
defenses_path: config/defenses
# Keeps task history across restarts; `memory` would reset it.
state:
  backend: sqlite
  path: proxy_state.sqlite3
servers:
  - id: server_a
    transport: streamable-http
    command: python
    args: ["-m", "fixtures.mock_servers.server_a", "--transport", "streamable-http", "--port", "8001", "--audit-log", "server_a_audit.jsonl"]
    host: 127.0.0.1
    port: 8001
    url: "http://127.0.0.1:8001/mcp"
  - id: server_b
    transport: streamable-http
    command: python
    args: ["-m", "fixtures.mock_servers.server_b", "--transport", "streamable-http", "--port", "8002", "--audit-log", "server_b_audit.jsonl"]
    host: 127.0.0.1
    port: 8002
    url: "http://127.0.0.1:8002/mcp"
