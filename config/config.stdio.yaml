# Config A: Agent <-> Proxy <-> ServerA/ServerB, entirely over stdio.
# Reference config for manual runs. Tests build their own ProxyConfig with
# tmp_path-scoped audit log paths rather than loading this file directly.
agent_transport: stdio
identity:
  # stdio has no per-connection credentials: whoever launches the proxy is
  # this principal (see docs/decisions/0011).
  stdio_principal: local-agent
policy_path: config/policies/default.yaml
audit_log_path: proxy_audit.jsonl
# Operator classification of tool semantics, and enabled defenses (V3).
tools_path: config/tools.yaml
defenses_path: config/defenses
# Keeps task history across restarts; `memory` would reset it.
state:
  backend: sqlite
  path: proxy_state.sqlite3
servers:
  - id: server_a
    command: python
    args: ["-m", "fixtures.mock_servers.server_a", "--audit-log", "server_a_audit.jsonl"]
  - id: server_b
    command: python
    args: ["-m", "fixtures.mock_servers.server_b", "--audit-log", "server_b_audit.jsonl"]
