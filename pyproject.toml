[project]
name = "mcp-security-proxy"
version = "0.1.0"
description = "A proxy tool that stands between a client and MCP servers, providing transparency and security."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0,<3.0.0",
    "packaging>=24.0,<27.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "pyyaml>=6.0.0,<7.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
# Scan's classifier stage (ADR 0026). The core never imports these; install
# with `uv sync --extra classifier` only where scan.classifier is configured.
classifier = [
    "safetensors>=0.8.0,<1.0.0",
    "torch>=2.15.0,<3.0.0",
    "transformers>=5.22.0,<6.0.0",
]

# Defenses register here; config/defenses/ decides which are enabled.
[project.entry-points."mcp_security_proxy.defenses"]
call_budget = "mcp_security_proxy.defenses.samples.call_budget:create"
direct_claim_mismatch = "mcp_security_proxy.defenses.direct.claim_mismatch:create"
direct_definition_classifier = "mcp_security_proxy.defenses.direct.definition_classifier:create"
direct_hidden_metadata = "mcp_security_proxy.defenses.direct.hidden_metadata:create"
direct_schema_injection = "mcp_security_proxy.defenses.direct.schema_injection:create"
direct_tool_name_spoofing = "mcp_security_proxy.defenses.direct.tool_name_spoofing:create"
indirect_argument_propagation = "mcp_security_proxy.defenses.indirect.argument_propagation:create"
indirect_result_injection = "mcp_security_proxy.defenses.indirect.result_injection:create"
temporal_call_rate = "mcp_security_proxy.defenses.temporal.call_rate:create"
temporal_definition_drift = "mcp_security_proxy.defenses.temporal.definition_drift:create"

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "ruff>=0.7.0,<1.0.0",
    "mypy>=1.11.0,<2.0.0",
    "types-pyyaml>=6.0.0,<7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_security_proxy", "fixtures"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "src/mcp_security_proxy/defenses"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
packages = ["mcp_security_proxy", "fixtures"]
mypy_path = ["src"]

# The classifier extra (ADR 0026) is imported lazily and used as Any; its
# stubs are not checked (numpy's need Python 3.12 syntax).
[[tool.mypy.overrides]]
module = [
    "numpy",
    "numpy.*",
    "safetensors",
    "safetensors.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
]
follow_imports = "skip"
follow_imports_for_stubs = true
